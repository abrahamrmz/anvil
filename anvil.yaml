# Anvil - Deployment Manifest (adaptado para Abraham, 2026-08-21)
# Selección basada en auditoría de ~/Desktop/repos: stack Python/Django/Celery,
# scrapers Selenium, pipelines LLM (DeepInfra/OpenRouter/Anthropic), deploy VPS.
#
# sync_mode:
#   - "symlink" (default): target/{component} -> repo. Edits go directly to repo.
#   - "copy": copies files. Used for agents (tier resolution) and pinned components.
#
# Component tags:
#   - "HEAD"    -> follows current branch
#   - "v1.0.0"  -> pinned to git tag (copy)
#   - "abc1234" -> pinned to commit SHA (copy)
#
# NOTA: con tag HEAD los skills quedan como symlinks al repo — un `git pull` o
# `anvil update` cambia las instrucciones vivas. Trabajar en una rama local
# (ej. `adaptacion`) y traer cambios de upstream solo tras revisarlos.

# Deploy targets — solo Claude Code (única herramienta en uso).
targets:
  claude:
    enabled: true
    path: ~/.claude
  opencode:
    enabled: false
    path: ~/.config/opencode
  gemini:
    enabled: false
    path: ~/.gemini
  codex:
    enabled: false
    path: ~/.codex
  cursor:
    enabled: false
    path: ~/.cursor

cursor_projects: []

# include = whitelist (tiene precedencia sobre exclude). Nombres sin .md.
components:
  agents:
    tag: "HEAD"
    include:
      - explorer        # investigación read-only con detección de prompt injection
      - security        # SAST/secrets/auth — el gap más grande del portafolio
      - qa              # revisión con gate de calidad
      - tester          # tests (pytest) — para subir cobertura en repos legacy
      - dba             # migraciones/esquema — útil para SQLite→PostgreSQL de pdl_mty
      - tech-writer     # README/docs — para los repos sin documentación
      # NOTA: el agente "reporter" del README no existe como archivo en agents/;
      # su función la cubre la skill reporter (incluida abajo).
      # Excluidos: developer-backend/frontend/mobile (Go/React/Flutter-céntricos),
      # pm, architect, designers, devops, mkt-content, load-tester, observability,
      # dba-broker/cache/nosql/reader, y demás. Agregar aquí si hacen falta.
      # - developer-ai  # candidato: desarrollo de features LLM (prompting, evals)

  skills:
    tag: "HEAD"
    include:
      # --- núcleo Python ---
      - python-conventions   # OJO: SKILL.md referencia 9 archivos inexistentes — podar
      - lint                 # ruff; detecta Makefile/pyproject por proyecto
      - run-tests            # pytest / manage.py test con coverage
      # --- flujo de trabajo ---
      - handoff              # continuidad entre sesiones (.handoff/)
      - scan-project         # genera context.md de un repo
      - context-nav          # formaliza el patrón .project-context/ ya en uso
      - reporter             # reporte de cierre de sesión + deltas a .project-context/
      # --- bases de datos ---
      - db-engines           # postgresql/sqlite/redis — migración pdl_mty y Celery
      - db-optimize
      - db-schema-scan
      # --- calidad y revisión ---
      - post-review          # checklist de postgres aplica; ignorar go/react/terraform
      - code-review-rubric
      - dependency-check     # auditoría de paquetes (requirements congelados 2024)
      - test-api             # validación de contratos — APIs django-ninja/DRF
      # --- git ---
      - git-commit           # PENDIENTE: ajustar a commits en español tipo(area):
      - git-diff
      - committer-flow
      # --- IA ---
      - ai-engineering       # prompting/evals/providers — pipelines DeepInfra/OpenRouter
      # --- utilidades ---
      - generate-diagram     # mermaid (C4, ERD, secuencia)
      # Candidatos futuros (activar descomentando):
      # - ai-architecture    # diseño de features IA con criterio de eval
      # - service-map        # dependencias cross-repo (radarman <-> dashboard)
      # - cross-service-dev  # cambios coordinados multi-repo
      # - e2e-test-run       # Playwright/Cypress
      # - perf               # carga con vegeta/k6/locust
      # - infra-probe        # diagnóstico de VPS
      # Excluidos por stack: go/react/flutter/rust/swift/astro/typescript-conventions,
      # devops-conventions, mcp-dev/setup, design-*, drawio, social-content, export-system.
      # Skills propias por crear: django-conventions, monitoreo-conventions, secrets-hygiene.

  commands:
    tag: "HEAD"
    # Solo existen comandos de git + cross-service-dev; se despliegan todos.

# Sin CLAUDE.md global: no existe en la raíz del repo y así debe quedarse —
# los CLAUDE.md por proyecto (pdl_mty, etc.) son la fuente de verdad.
files: {}

registries:
  - name: official
    path: .

# Local-only paths - NEVER synced, NEVER touched
ignore:
  - settings.json
  - settings.local.json
  - history.jsonl
  - sessions/
  - projects/
  - plugins/
  - session-env/
  - shell-snapshots/
  - cache/
  - debug/
  - downloads/
  - file-history/
  - paste-cache/
  - plans/
  - ide/
  - backups/
  - hooks/
  - stats-cache.json
  - mcp-needs-auth-cache.json
  - project-registry.md
  - .workspace/
  - .claude/
